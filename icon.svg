<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  
  <!-- Clipboard Board -->
  <rect x="116" y="116" width="280" height="300" rx="36" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Clipboard Top Clip -->
  <rect x="186" y="86" width="140" height="56" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="8" />
  <circle cx="256" cy="114" r="12" fill="#4f46e5" />
  
  <!-- Checklist Lines -->
  <line x1="200" y1="200" x2="340" y2="200" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
  <line x1="200" y1="264" x2="340" y2="264" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
  <line x1="200" y1="328" x2="300" y2="328" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
  
  <!-- Green Checkmarks -->
  <path d="M150 200 l14 14 l28 -28" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M150 264 l14 14 l28 -28" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M150 328 l14 14 l28 -28" fill="none" stroke="#6366f1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
