# ==============================================================================
# Cloudflare Pages & Workers Unified Configuration - Team TaskFlow
# ==============================================================================

name = "team-taskflow"
main = "worker.js"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."
workers_dev = true

# หมายเหตุสำหรับการผูกฐานข้อมูล Cloudflare D1 (Database Binding):
# ในหน้า Cloudflare Dashboard (ทั้ง Pages และ Workers)
# ให้ไปที่ Settings -> Variables (หรือ Functions) -> D1 Database Bindings
# กำหนด Variable name: DB และเลือกฐานข้อมูล team-taskflow-db
