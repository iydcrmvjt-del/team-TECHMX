# ==============================================================================
# Cloudflare Pages & Workers Unified Configuration - Team TaskFlow
# ==============================================================================

name = "team-taskflow"
main = "worker.js"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."
workers_dev = true

# หมายเหตุสำหรับการผูกฐานข้อมูล Cloudflare D1 (Database Binding):
# ผูก D1 Database ถาวรผ่านโค้ด ป้องกันการหลุดเวลามีการ deploy ใหม่จาก GitHub
[[d1_databases]]
binding = "DB"
database_name = "team-taskflow-db"
database_id = "e8af7dcc-b7da-4e89-8ae0-63d197b948ff"

# Cron Trigger:
# 1. ส่งสรุปงานเข้า Lark อัตโนมัติทุกเช้า 09:00 น. วันจันทร์–ศุกร์ (เวลาไทย UTC+7 = 02:00 UTC)
# 2. แจ้งเตือนเช็กสถานะงานประจำวันทุกเย็น 18:00 น. วันจันทร์–ศุกร์ (เวลาไทย UTC+7 = 11:00 UTC)
[triggers]
crons = ["0 2 * * 1-5", "0 11 * * 1-5"]
